server:
  port: 8084

spring:
  profiles:
    include: docker-compose.infra,kafka,topics
  application:
    name: chat-service
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://34.50.50.170:13100}
  cloud:
    config:
      uri: ${SPRING_CLOUD_CONFIG_URI:http://34.50.50.170:13100}
      discovery:
        enabled: ${SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED:false}
        service-id: config-server


eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    prefer-ip-address: true
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
