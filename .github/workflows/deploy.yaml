name: Deploy Chat Service

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar --no-daemon
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}

      - name: Copy files to GCE
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USERNAME }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          source: "build/libs/chat-0.0.1-SNAPSHOT.jar,Dockerfile,src/main/resources/ssl/kafka.server.truststore.jks"
          target: "/home/${{ secrets.GCE_USERNAME }}/chat-service"
          strip_components: 0
          overwrite: true
          timeout: 60s
          command_timeout: 120s

      - name: Deploy to GCE
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USERNAME }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          script: |
            cd ~/chat-service
            docker build --no-cache -t chat-service .
            docker stop chat-service || true
            docker rm chat-service || true

            set -- \
              -e SPRING_CLOUD_CONFIG_URI=http://34.50.50.170:13100 \
              -e SPRING_PROFILES_ACTIVE=local \
              -e EUREKA_SERVER_URL=http://34.64.58.121:8761/eureka/,http://34.64.104.174:8761/eureka/ \
              -e EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://34.64.58.121:8761/eureka/,http://34.64.104.174:8761/eureka/ \
              -e SPRING_KAFKA_SSL_TRUST_STORE_LOCATION=file:/app/ssl/kafka.server.truststore.jks

            if [ -n "${{ secrets.TRUST_STORE_PASSWORD }}" ]; then
              set -- "$@" -e TRUST_STORE_PASSWORD="${{ secrets.TRUST_STORE_PASSWORD }}"
            fi
            if [ -n "${{ secrets.DB_URL }}" ]; then
              set -- "$@" -e DB_URL="${{ secrets.DB_URL }}"
            fi
            if [ -n "${{ secrets.DB_USERNAME }}" ]; then
              set -- "$@" -e DB_USERNAME="${{ secrets.DB_USERNAME }}"
            fi
            if [ -n "${{ secrets.DB_PASSWORD }}" ]; then
              set -- "$@" -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            fi
            if [ -n "${{ secrets.DB_DDL_AUTO }}" ]; then
              set -- "$@" -e DB_DDL_AUTO="${{ secrets.DB_DDL_AUTO }}"
            fi

            docker run -d \
              --name chat-service \
              --restart unless-stopped \
              -p 8084:8084 \
              "$@" \
              chat-service

            sleep 10
            docker logs --tail 120 chat-service
